# Production environment.
# Run with: docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Note: no "ports:" here on purpose — the database should only be
    # reachable from other containers on this Compose network, never
    # directly from the internet.

  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      target: prod
    env_file: .env
    volumes:
      # Named volumes so static/media files survive container restarts and
      # so the Nginx container (below) can read the same files
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    depends_on:
      - db
    restart: unless-stopped
    # Also no "ports:" here — Nginx is the only container exposed publicly;
    # everything reaches Django through it.

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/backend/staticfiles:ro
      - media_volume:/app/backend/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
