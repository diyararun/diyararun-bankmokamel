# Production environment.
# Run with: docker compose -f docker-compose.prod.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Note: no "ports:" here on purpose — the database should only be
    # reachable from other containers on this Compose network, never
    # directly from the internet.

  backend:
    build:
      context: .
      dockerfile: docker/django/Dockerfile
      target: prod
    env_file: .env
    # "environment:" takes precedence over the same variable coming from
    # "env_file:", so this always wins even though .env sets it to "dev"
    # for local development.
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings.prod
    volumes:
      # Named volumes so static/media files survive container restarts and
      # so the Nginx container (below) can read the same files
      - static_volume:/app/backend/staticfiles
      - media_volume:/app/backend/media
    depends_on:
      - db
    restart: unless-stopped
    # Also no "ports:" here — Nginx is the only container exposed publicly;
    # everything reaches Django through it.

  nginx:
    # Built from docker/nginx/Dockerfile, which COPYs default.conf into the
    # image at build time — NOT bind-mounted from the host. This is the
    # root-cause fix for the "not a directory" mount error documented in
    # «عیب‌یابی: خطای Mount شدن nginx.conf هنگام دیپلوی اپلیکیشن» (living
    # doc: راه‌اندازی سرور امن با Coolify): Coolify's per-app host path for
    # a bind-mounted file didn't exist on first deploy, so Docker silently
    # created an empty directory there instead of the file, and every
    # subsequent deploy then failed trying to mount a file onto that
    # directory. Baking the config into the image removes that host-path
    # dependency entirely.
    #
    # Trade-off: changing default.conf now requires rebuilding this image
    # (docker compose -f docker-compose.prod.yml up --build -d), it can no
    # longer be edited on the host and picked up without a rebuild.
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    volumes:
      - static_volume:/app/backend/staticfiles:ro
      - media_volume:/app/backend/media:ro
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume: