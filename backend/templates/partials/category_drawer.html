<!-- ==================== CATEGORY DRAWER ( کشوی دسته‌بندی‌ها ) ==================== -->
<div
  id="categoryDrawerModal"
  class="fixed inset-0 z-[110] opacity-0 pointer-events-none transition-opacity duration-300"
>
  <!-- Backdrop -->
  <div
    onclick="closeCategoryDrawer()"
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
  ></div>

  <div
    id="categoryDrawer"
    class="absolute top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transition-transform duration-300 translate-x-full flex flex-col justify-between"
  >
    <!-- Header -->
    <div
      class="p-5 border-b border-slate-100 flex items-center justify-between"
    >
      <div class="flex items-center gap-2">
        <svg
          class="w-6 h-6 text-red-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          />
        </svg>
        <h3 class="font-bold text-slate-900 text-lg">دسته‌بندی محصولات</h3>
      </div>
      <button
        onclick="closeCategoryDrawer()"
        class="p-2 text-slate-400 hover:text-slate-800 rounded-full transition-colors"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Content Area (لیست دسته‌بندی‌ها) -->
    <div class="p-5 flex-1 overflow-y-auto space-y-3">
      <!-- نمونه دسته اصلی اول (دارای زیرمجموعه) -->
      <!-- نمونه دسته اصلی با انیمیشن نرم -->
      <div
        class="border border-slate-100 rounded-2xl overflow-hidden bg-slate-50/50"
      >
        <button
          onclick="toggleSubCategory('sub-protien')"
          class="w-full p-4 flex items-center justify-between font-bold text-slate-800 hover:text-red-600 transition-colors text-right"
        >
          <div class="flex items-center gap-3">
            <span
              class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-lg"
              >🧪</span
            >
            <span class="text-sm">پروتئین‌ها</span>
          </div>
          <svg
            id="arrow-sub-protien"
            class="w-4 h-4 text-slate-400 transition-transform duration-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <!-- کانتینر آکاردئون با انیمیشن Smooth Grid -->
        <div
          id="sub-protien"
          class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out"
        >
          <div class="overflow-hidden bg-white border-t border-slate-100">
            <div class="px-4 py-2 space-y-1">
              <a
                href="{% url 'store:products' %}?category=whey"
                class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50 transition-colors"
                >پروتئین وی (Whey)</a
              >
              <a
                href="{% url 'store:products' %}?category=iso"
                class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50 transition-colors"
                >پروتئین ایزوله</a
              >
              <a
                href="{% url 'store:products' %}?category=casein"
                class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50 transition-colors"
                >پروتئین کازئین</a
              >
            </div>
          </div>
        </div>
      </div>

      <!-- نمونه دسته اصلی دوم (دارای زیرمجموعه) -->
      <div
        class="border border-slate-100 rounded-2xl overflow-hidden bg-slate-50/50"
      >
        <button
          onclick="toggleSubCategory('sub-amino')"
          class="w-full p-4 flex items-center justify-between font-bold text-slate-800 hover:text-red-600 transition-colors text-right"
        >
          <div class="flex items-center gap-3">
            <span
              class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-lg"
              >⚡</span
            >
            <span class="text-sm">آمینو اسید و BCAA</span>
          </div>
          <svg
            id="arrow-sub-amino"
            class="w-4 h-4 text-slate-400 transition-transform duration-200"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>
        <div
          id="sub-amino"
          class="hidden bg-white border-t border-slate-100 px-4 py-2 space-y-1"
        >
          <a
            href="{% url 'store:products' %}?category=bcaa"
            class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50"
            >BCAA پودری و قرصی</a
          >
          <a
            href="{% url 'store:products' %}?category=eaa"
            class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50"
            >آمینو اسید EAA</a
          >
        </div>
      </div>

      <!-- نمونه دسته بدون زیرمجموعه -->
      <a
        href="{% url 'store:products' %}?category=creatine"
        class="p-4 flex items-center justify-between font-bold text-slate-800 hover:text-red-600 border border-slate-100 rounded-2xl bg-slate-50/50 transition-colors"
      >
        <div class="flex items-center gap-3">
          <span
            class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-lg"
            >💥</span
          >
          <span class="text-sm">کراتین</span>
        </div>
        <span
          class="text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-1 rounded-full"
          >ویژه</span
        >
      </a>
    </div>

    <!-- Footer -->
    <div class="p-5 border-t border-slate-100 bg-slate-50">
      <a href="{% url 'store:products' %}" class="block">
        <button
          class="w-full bg-slate-900 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-md"
        >
          مشاهده همه محصولات
        </button>
      </a>
    </div>
  </div>
</div>
