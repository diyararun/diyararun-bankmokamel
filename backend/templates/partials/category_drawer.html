<!-- ==================== CATEGORY DRAWER ( کشوی دسته‌بندی‌ها ) ==================== -->
<div
  id="categoryDrawerModal"
  class="fixed inset-0 z-[110] opacity-0 pointer-events-none transition-opacity duration-300"
>
  <!-- Backdrop -->
  <div
    onclick="closeCategoryDrawer()"
    class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm"
  ></div>

  <div
    id="categoryDrawer"
    class="absolute top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl transition-transform duration-300 translate-x-full flex flex-col justify-between"
  >
    <!-- Header -->
    <div
      class="p-5 border-b border-slate-100 flex items-center justify-between"
    >
      <div class="flex items-center gap-2">
        <svg
          class="w-6 h-6 text-red-600"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"
          />
        </svg>
        <h3 class="font-bold text-slate-900 text-lg">دسته‌بندی محصولات</h3>
      </div>
      <button
        onclick="closeCategoryDrawer()"
        class="p-2 text-slate-400 hover:text-slate-800 rounded-full transition-colors"
      >
        <svg
          class="w-6 h-6"
          fill="none"
          stroke="currentColor"
          viewBox="0 0 24 24"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Content Area (لیست دسته‌بندی‌ها) — از drawer_categories پر می‌شود
         (apps/store/context_processors.py: category_drawer)، هر دسته‌ی
         اصلی همراه با زیردسته‌بندی‌های فعالش (.active_children). -->
    <div class="p-5 flex-1 overflow-y-auto space-y-3">
      {% for cat in drawer_categories %}
      {% if cat.active_children %}
      <!-- دسته‌ی اصلی دارای زیرمجموعه: آکاردئون -->
      <div
        class="border border-slate-100 rounded-2xl overflow-hidden bg-slate-50/50"
      >
        <button
          onclick="toggleSubCategory('sub-cat-{{ cat.id }}')"
          class="w-full p-4 flex items-center justify-between font-bold text-slate-800 hover:text-red-600 transition-colors text-right"
        >
          <div class="flex items-center gap-3">
            <span
              class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-lg overflow-hidden"
            >
              {% if cat.icon %}
              <img src="{{ cat.icon.url }}" alt="{{ cat.name }}" class="w-full h-full object-cover" />
              {% else %}
              🏷️
              {% endif %}
            </span>
            <span class="text-sm">{{ cat.name }}</span>
          </div>
          <svg
            id="arrow-sub-cat-{{ cat.id }}"
            class="w-4 h-4 text-slate-400 transition-transform duration-300"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M19 9l-7 7-7-7"
            />
          </svg>
        </button>

        <!-- کانتینر آکاردئون با انیمیشن Smooth Grid -->
        <div
          id="sub-cat-{{ cat.id }}"
          class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-300 ease-in-out"
        >
          <div class="overflow-hidden bg-white border-t border-slate-100">
            <div class="px-4 py-2 space-y-1">
              {% for sub in cat.active_children %}
              <a
                href="{% url 'store:products' %}?category={{ sub.slug }}"
                class="block py-2 px-3 text-xs font-semibold text-slate-600 hover:text-red-600 rounded-lg hover:bg-slate-50 transition-colors"
                >{{ sub.name }}</a
              >
              {% endfor %}
            </div>
          </div>
        </div>
      </div>
      {% else %}
      <!-- دسته‌ی اصلی بدون زیرمجموعه: لینک مستقیم -->
      <a
        href="{% url 'store:products' %}?category={{ cat.slug }}"
        class="p-4 flex items-center gap-3 font-bold text-slate-800 hover:text-red-600 border border-slate-100 rounded-2xl bg-slate-50/50 transition-colors"
      >
        <span
          class="w-9 h-9 rounded-xl bg-white shadow-sm flex items-center justify-center text-lg overflow-hidden shrink-0"
        >
          {% if cat.icon %}
          <img src="{{ cat.icon.url }}" alt="{{ cat.name }}" class="w-full h-full object-cover" />
          {% else %}
          🏷️
          {% endif %}
        </span>
        <span class="text-sm">{{ cat.name }}</span>
      </a>
      {% endif %}
      {% empty %}
      <p class="text-sm text-slate-400 text-center py-8">هنوز دسته‌بندی‌ای ثبت نشده است.</p>
      {% endfor %}
    </div>

    <!-- Footer -->
    <div class="p-5 border-t border-slate-100 bg-slate-50">
      <a href="{% url 'store:products' %}" class="block">
        <button
          class="w-full bg-slate-900 hover:bg-red-600 text-white font-bold py-3.5 rounded-xl transition-all shadow-md"
        >
          مشاهده همه محصولات
        </button>
      </a>
    </div>
  </div>
</div>
