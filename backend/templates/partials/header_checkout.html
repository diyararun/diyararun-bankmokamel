    <header
      class="sticky top-0 z-50 bg-white/95 backdrop-blur-md border-b border-slate-100 shadow-sm"
    >
      <div
        class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between gap-4"
      >
        <div class="flex items-center gap-8">
          <a href="{% url 'store:index' %}" class="flex items-center gap-2 group">
            <!-- نشست ۴۹: تصویرِ برند (SiteSettings.brand_image)، وقتی فروشنده از پنلِ ادمین وارد کرده باشد؛ وگرنه همان باکسِ ثابتِ «BM» قبلی -->
            {% if site_settings.brand_image %}
            <img
              src="{{ site_settings.brand_image.url }}"
              alt="بانک مکمل"
              class="w-10 h-10 rounded-xl object-cover shadow-lg shadow-red-600/30 group-hover:scale-105 transition-transform"
            />
            {% else %}
            <div
              class="w-10 h-10 bg-red-600 rounded-xl flex items-center justify-center text-white font-black text-xl shadow-lg shadow-red-600/30 group-hover:scale-105 transition-transform"
            >
              BM
            </div>
            {% endif %}
            <span class="text-2xl font-black text-slate-900 tracking-tight"
              >بانک<span class="text-red-600">مکمل</span></span
            >
          </a>
        </div>

        <!--
          گام‌های ثبت سفارش (Steps Indicator).

          این partial حالا دو حالت دارد، بسته به متغیر context به اسم
          checkout_step که include کننده پاس می‌دهد:
          - checkout_step تعریف نشده (مقدار پیش‌فرض) → همان چیزی که همیشه
            بود: گام ۲ («اطلاعات ارسال و پرداخت») فعال — همین حالتی که
            checkout.html استفاده می‌کند.
          - checkout_step=3 → گام‌های ۱ و ۲ به‌عنوان «انجام‌شده» (سبز) نمایش
            داده می‌شوند و گام ۳ («تکمیل و دریافت فاکتور») فعال است — همان
            چیزی که order_detail.html وقتی سفارش هنوز پرداخت نشده استفاده
            می‌کند (یعنی همان صفحه‌ی «تکمیل و دریافت فاکتور» که در نقشه‌ی
            استپر به آن اشاره شده).
        -->
        <div class="hidden md:flex items-center gap-3 text-xs font-bold">
          {% if checkout_step == 3 %}
          <span class="text-emerald-600 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            ۱. سبد خرید
          </span>
          <span class="text-slate-300">←</span>
          <span class="text-emerald-600 flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
            ۲. اطلاعات ارسال و پرداخت
          </span>
          <span class="text-slate-300">←</span>
          <span
            class="text-red-600 bg-red-50 px-3 py-1.5 rounded-xl border border-red-100 flex items-center gap-1.5"
          >
            <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
            ۳. تکمیل و دریافت فاکتور
          </span>
          {% else %}
          <span class="text-slate-400">۱. سبد خرید</span>
          <span class="text-slate-300">←</span>
          <span
            class="text-red-600 bg-red-50 px-3 py-1.5 rounded-xl border border-red-100 flex items-center gap-1.5"
          >
            <span class="w-2 h-2 rounded-full bg-red-600 animate-pulse"></span>
            ۲. اطلاعات ارسال و پرداخت
          </span>
          <span class="text-slate-300">←</span>
          <span class="text-slate-400">۳. تکمیل و دریافت فاکتور</span>
          {% endif %}
        </div>

        <div class="flex items-center gap-2 text-xs text-slate-500 font-bold">
          <svg
            class="w-5 h-5 text-emerald-600"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
            />
          </svg>
          <span>پرداخت امن متصل به درگاه بانکی</span>
        </div>
      </div>
    </header>
