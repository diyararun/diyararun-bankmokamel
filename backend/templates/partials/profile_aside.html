<aside class="lg:col-span-1">
        <div
          class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-6 lg:sticky lg:top-24"
        >
          <div class="flex flex-col items-center text-center gap-3">
            <span
              class="w-20 h-20 rounded-full bg-red-600 text-white flex items-center justify-center text-4xl shadow-lg shadow-red-600/30"
              >{{ user.avatar_emoji }}</span
            >
            <div>
              <h2 class="font-black text-slate-900">{{ user.display_name }}</h2>
              <p class="text-xs text-slate-400 mt-0.5" dir="ltr">{{ user.phone }}</p>
            </div>
          </div>

          <nav class="space-y-1.5 text-sm font-bold">
            <a
              href="{% url 'accounts:profile' %}"
              class="flex items-center gap-2.5 px-4 py-3 rounded-xl bg-red-50 text-red-600"
            >
              <span>👤</span>
              اطلاعات حساب کاربری
            </a>
            <a
              href="{% url 'store:checkout' %}"
              class="flex items-center gap-2.5 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-red-600 transition-colors"
            >
              <span>📦</span>
              سفارش‌های من
            </a>
            <a
              href="#"
              class="flex items-center gap-2.5 px-4 py-3 rounded-xl text-slate-600 hover:bg-slate-50 hover:text-red-600 transition-colors"
            >
              <span>📍</span>
              آدرس‌های من
            </a>
            <form action="{% url 'accounts:logout' %}" method="post" class="pt-2 mt-2 border-t border-slate-100">
              {% csrf_token %}
              <button
                type="submit"
                class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 transition-colors"
              >
                <span>🚪</span>
                خروج از حساب
              </button>
            </form>
          </nav>
        </div>
      </aside>
