<aside class="lg:col-span-1">
        <div
          class="bg-white rounded-3xl border border-slate-200/80 shadow-sm lg:p-6 lg:space-y-6 lg:sticky lg:top-24 overflow-hidden"
        >
          <!--
            نشست ۳۵: پایین‌تر از 1024px این سایدبار به‌جای همیشه-باز، یک
            دراپ‌داون بسته (پیش‌فرض) است — دکمه‌ی زیر (نام + شماره +
            chevron) با کلیک لینک‌ها را باز/بسته می‌کند، تا مشتری با ورود
            به صفحه اول محتوای اصلی (مثلاً فرم ویرایش اطلاعات) را ببیند،
            نه این‌که کل بالای صفحه را سایدبار بگیرد. از 1024px به بالا
            دقیقاً همان چیزی است که قبلاً بود: همیشه باز، ثابت (sticky).
            toggleAccountSidebarMenu در frontend/src/js/accountNav.js.
          -->
          <div class="hidden lg:flex flex-col items-center text-center gap-3">
            <span
              class="w-20 h-20 rounded-full bg-red-100 text-white flex items-center justify-center text-4xl shadow-md shadow-red-600/30"
              >{{ user.avatar_emoji }}</span
            >
            <div>
              <h2 class="font-title font-black text-slate-900">{{ user.display_name }}</h2>
              <p class="text-xs text-slate-400 mt-0.5" dir="ltr">{{ user.phone }}</p>
            </div>
          </div>

          <button
            type="button"
            id="accountSidebarToggle"
            onclick="toggleAccountSidebarMenu()"
            aria-expanded="false"
            aria-controls="accountSidebarNav"
            class="lg:hidden w-full flex items-center justify-between gap-3 p-4"
          >
            <span class="flex items-center gap-2.5">
              <span
                class="w-10 h-10 rounded-full bg-red-100 text-white flex items-center justify-center text-lg shrink-0 shadow-md shadow-red-600/30"
                >{{ user.avatar_emoji }}</span
              >
              <span class="text-right">
                <span class="block font-black text-slate-900 text-sm">{{ user.display_name }}</span>
                <span class="block text-xs text-slate-400" dir="ltr">{{ user.phone }}</span>
              </span>
            </span>
            <svg
              id="accountSidebarChevron"
              class="w-4 h-4 text-slate-500 shrink-0 transition-transform duration-200"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
            </svg>
          </button>

          <nav
            id="accountSidebarNav"
            class="hidden lg:block space-y-1.5 text-sm font-bold border-t border-slate-100 mt-1 pt-3 px-4 pb-4 lg:border-0 lg:mt-0 lg:pt-0 lg:px-0 lg:pb-0"
          >
            <!--
              active_page یک context var است که هر ویو (profile_view،
              order_list_view/order_detail_view، address_list_view/...) خودش
              مقداردهی می‌کند — پس این سایدبار دیگر همیشه «اطلاعات حساب
              کاربری» را فعال نشان نمی‌دهد، بلکه واقعاً بخشی که کاربر در آن
              است را نشان می‌دهد. کلاس js-account-nav هم برای ناوبری بدون
              رفرش کامل صفحه استفاده می‌شود (frontend/src/js/accountNav.js).
            -->
            <a
              href="{% url 'accounts:profile' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'profile' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>👤</span>
              اطلاعات حساب کاربری
            </a>
            <a
              href="{% url 'accounts:orders' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'orders' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>📦</span>
              سفارش‌های من
            </a>
            <a
              href="{% url 'accounts:addresses' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'addresses' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>📍</span>
              آدرس‌های من
            </a>
            <form action="{% url 'accounts:logout' %}" method="post" class="pt-2 mt-2 border-t border-slate-100">
              {% csrf_token %}
              <button
                type="submit"
                class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 transition-colors"
              >
                <!--
                  قبلاً اموجی 🚪 (در بعضی فونت‌ها به شکل یک در ساده دیده
                  می‌شود، نه لزوماً «خروج») — جایگزین شد با آیکون استاندارد
                  log-out (پیکان رو به بیرون از یک قاب) که در تقریباً همه‌ی
                  رابط‌های کاربری برای «خروج از حساب» استفاده می‌شود و
                  ابهامی در معنی‌اش وجود ندارد.
                -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                خروج از حساب
              </button>
            </form>
          </nav>
        </div>
      </aside>
