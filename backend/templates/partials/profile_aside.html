<aside class="lg:col-span-1">
        <div
          class="bg-white rounded-3xl border border-slate-200/80 shadow-sm p-6 space-y-6 lg:sticky lg:top-24"
        >
          <div class="flex flex-col items-center text-center gap-3">
            <span
              class="w-20 h-20 rounded-full bg-red-600 text-white flex items-center justify-center text-4xl shadow-lg shadow-red-600/30"
              >{{ user.avatar_emoji }}</span
            >
            <div>
              <h2 class="font-black text-slate-900">{{ user.display_name }}</h2>
              <p class="text-xs text-slate-400 mt-0.5" dir="ltr">{{ user.phone }}</p>
            </div>
          </div>

          <nav class="space-y-1.5 text-sm font-bold">
            <!--
              active_page یک context var است که هر ویو (profile_view،
              order_list_view/order_detail_view، address_list_view/...) خودش
              مقداردهی می‌کند — پس این سایدبار دیگر همیشه «اطلاعات حساب
              کاربری» را فعال نشان نمی‌دهد، بلکه واقعاً بخشی که کاربر در آن
              است را نشان می‌دهد. کلاس js-account-nav هم برای ناوبری بدون
              رفرش کامل صفحه استفاده می‌شود (frontend/src/js/accountNav.js).
            -->
            <a
              href="{% url 'accounts:profile' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'profile' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>👤</span>
              اطلاعات حساب کاربری
            </a>
            <a
              href="{% url 'accounts:orders' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'orders' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>📦</span>
              سفارش‌های من
            </a>
            <a
              href="{% url 'accounts:addresses' %}"
              class="js-account-nav flex items-center gap-2.5 px-4 py-3 rounded-xl transition-colors {% if active_page == 'addresses' %}bg-red-50 text-red-600{% else %}text-slate-600 hover:bg-slate-50 hover:text-red-600{% endif %}"
            >
              <span>📍</span>
              آدرس‌های من
            </a>
            <form action="{% url 'accounts:logout' %}" method="post" class="pt-2 mt-2 border-t border-slate-100">
              {% csrf_token %}
              <button
                type="submit"
                class="w-full flex items-center gap-2.5 px-4 py-3 rounded-xl text-red-600 hover:bg-red-50 transition-colors"
              >
                <!--
                  قبلاً اموجی 🚪 (در بعضی فونت‌ها به شکل یک در ساده دیده
                  می‌شود، نه لزوماً «خروج») — جایگزین شد با آیکون استاندارد
                  log-out (پیکان رو به بیرون از یک قاب) که در تقریباً همه‌ی
                  رابط‌های کاربری برای «خروج از حساب» استفاده می‌شود و
                  ابهامی در معنی‌اش وجود ندارد.
                -->
                <svg xmlns="http://www.w3.org/2000/svg" class="w-[18px] h-[18px]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                  <polyline points="16 17 21 12 16 7" />
                  <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
                خروج از حساب
              </button>
            </form>
          </nav>
        </div>
      </aside>
