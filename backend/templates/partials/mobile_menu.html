<div
  id="mobileMenuBackdrop"
  onclick="toggleMobileMenu()"
  class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 opacity-0 pointer-events-none transition-opacity duration-300 md:hidden"
></div>
<div
  id="mobileMenu"
  class="fixed top-20 inset-x-0 z-50 md:hidden bg-white border-b border-slate-100 shadow-2xl rounded-b-3xl overflow-hidden max-h-0 opacity-0 transition-all duration-300 ease-out"
>
  <nav class="px-5 py-5 space-y-1.5">
    <a
      href="{% url 'store:index' %}"
      onclick="toggleMobileMenu()"
      class="block px-4 py-3 rounded-xl font-bold text-sm {% if active_nav == 'home' %}text-red-600 bg-red-50{% else %}text-slate-700 hover:bg-slate-50 hover:text-red-600{% endif %} transition-colors"
      >خانه</a
    >
    <a
      href="{% url 'store:products' %}"
      onclick="toggleMobileMenu()"
      class="block px-4 py-3 rounded-xl font-bold text-sm {% if active_nav == 'products' %}text-red-600 bg-red-50{% else %}text-slate-700 hover:bg-slate-50 hover:text-red-600{% endif %} transition-colors"
      >محصولات</a
    >
    <a
      href="{% url 'store:about' %}"
      onclick="toggleMobileMenu()"
      class="block px-4 py-3 rounded-xl font-bold text-sm {% if active_nav == 'about' %}text-red-600 bg-red-50{% else %}text-slate-700 hover:bg-slate-50 hover:text-red-600{% endif %} transition-colors"
      >درباره ما</a
    >
    <a
      href="{% url 'store:contact' %}"
      onclick="toggleMobileMenu()"
      class="block px-4 py-3 rounded-xl font-bold text-sm {% if active_nav == 'contact' %}text-red-600 bg-red-50{% else %}text-slate-700 hover:bg-slate-50 hover:text-red-600{% endif %} transition-colors"
      >ارتباط با ما</a
    >

    {% if user.is_authenticated %}
      <div class="pt-3 mt-2 border-t border-slate-100 space-y-1.5">
        <a
          href="{% url 'accounts:profile' %}"
          onclick="toggleMobileMenu()"
          class="flex items-center gap-2 px-4 py-3 rounded-xl font-bold text-sm text-slate-700 hover:bg-slate-50 hover:text-red-600 transition-colors"
        >
          <span
            class="w-7 h-7 rounded-full bg-red-600 text-white flex items-center justify-center text-sm shrink-0"
            >{{ user.avatar_emoji }}</span
          >
          <span class="truncate">{{ user.display_name }}</span>
        </a>
        <form action="{% url 'accounts:logout' %}" method="post">
          {% csrf_token %}
          <button
            type="submit"
            class="w-full flex items-center justify-center gap-2 bg-slate-100 hover:bg-red-50 text-red-600 font-bold text-sm px-5 py-3 rounded-xl transition-all"
          >
            <span>🚪</span>
            خروج از حساب
          </button>
        </form>
      </div>
    {% else %}
      <div class="pt-3 mt-2 border-t border-slate-100">
        <a
          href="{% url 'accounts:auth' %}"
          class="flex items-center justify-center gap-2 bg-slate-900 hover:bg-red-600 text-white font-bold text-sm px-5 py-3 rounded-xl transition-all shadow-md"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
            />
          </svg>
          ورود | ثبت‌نام
        </a>
      </div>
    {% endif %}
  </nav>
</div>


<!-- Bottom Navigation Bar برای موبایل (md:hidden) -->
<div class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2 px-4 md:hidden shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
  <div class="flex items-center justify-around">
    
    <!-- ۱. خانه -->
    <a
      href="{% url 'store:index' %}"
      class="flex flex-col items-center gap-1 text-[11px] font-bold transition-colors {% if active_nav == 'home' %}text-red-600{% else %}text-slate-500 hover:text-slate-900{% endif %}"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
      </svg>
      <span>خانه</span>
    </a>

    <!-- ۲. دسته‌بندی / محصولات -->
    <button
      onclick="openCategoryDrawer()"
      class="flex flex-col items-center gap-1 text-[11px] font-bold text-slate-500 hover:text-slate-900 transition-colors"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
      </svg>
      <span>دسته‌بندی</span>
    </button>

    <!-- ۳. سبد خرید -->
    <button
      onclick="openCartDrawer()"
      class="relative flex flex-col items-center gap-1 text-[11px] font-bold text-slate-500 hover:text-slate-900 transition-colors"
    >
      <div class="relative">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
        </svg>
        <span
          id="cartBadgeMobile"
          class="absolute -top-1 -right-1 w-4 h-4 bg-red-600 text-white text-[10px] font-bold rounded-full flex items-center justify-center"
        >۰</span>
      </div>
      <span>سبد خرید</span>
    </button>

    <!-- ۴. پروفایل -->
    {% if user.is_authenticated %}
      <a
        href="{% url 'accounts:profile' %}"
        class="flex flex-col items-center gap-1 text-[11px] font-bold transition-colors {% if active_nav == 'profile' %}text-red-600{% else %}text-slate-500 hover:text-slate-900{% endif %}"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span>پروفایل</span>
      </a>
    {% else %}
      <a
        href="{% url 'accounts:auth' %}"
        class="flex flex-col items-center gap-1 text-[11px] font-bold text-slate-500 hover:text-slate-900 transition-colors"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
        </svg>
        <span>ورود</span>
      </a>
    {% endif %}

  </div>
</div>
