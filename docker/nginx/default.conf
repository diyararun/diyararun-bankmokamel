# "backend" here is the Docker Compose service name of the Django container,
# resolved automatically by Docker's internal DNS — not a real hostname.
upstream django_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # نشست ۳۷: این عدد را عمداً *افزایش* دادیم (نه کاهش)، با این‌که در
    # همین نشست سقف هر فایل تصویر را به ۳ مگابایت محدود کردیم
    # (apps/catalog/validators.py) — چون این محدودیت nginx روی کل حجم
    # یک درخواست است، نه هر فایل به‌تنهایی. فرم صفحه‌ی ویرایش محصول همه‌ی
    # ردیف‌های اینلاین «تصاویر محصول» را در یک درخواست POST واحد
    # می‌فرستد؛ حالا که حداکثر ۵ تصویر در هر محصول مجاز است
    # (apps/catalog/admin.py، ProductImageInline.max_num)، بدترین حالت
    # واقعی ۵ عکس × ۳ مگابایت ≈ ۱۵ مگابایت در یک درخواست است، به‌علاوه‌ی
    # کمی overhead برای multipart/form-data و فیلدهای دیگر فرم (تنوع‌ها،
    # مشخصات فنی). عدد قبلی (۱۰M) از قبل کوچک‌تر از این بدترین حالت بود
    # و می‌توانست باعث رد شدن یک ذخیره‌ی کاملاً مجاز (۴-۵ تصویر هم‌زمان)
    # با خطای 413 در همین‌جا شود، قبل از این‌که اصلاً به بررسی‌های
    # جنگو/Pillow برسد — این عدد باید همیشه به‌وضوح بالاتر از «حداکثر
    # تعداد تصویر × حداکثر حجم هر تصویر» بماند، نه برابر یا نزدیک به
    # حداکثر حجم یک تصویر تنها.
    client_max_body_size 20M;

    # نشست ۵۲، مرحله‌ی ۴: فشرده‌سازیِ gzip — گزارشِ نشستِ ۵۱ آن را
    # «هنوز فعال نیست» گزارش کرده بود. فقط روی متن (HTML/CSS/JS/JSON/SVG)
    # اعمال می‌شود، نه روی خودِ تصاویر (JPEG/PNG) — چون آن‌ها از قبل
    # فرمت‌های فشرده‌اند و gzip دوباره روی‌شان یا هیچ سودی ندارد یا حتی
    # کمی حجم را بیشتر می‌کند. text/html نیازی به ذکرِ صریح ندارد؛ nginx
    # همیشه آن را در gzip_types داخلی‌اش دارد.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    # فایل‌های خیلی کوچک را فشرده نمی‌کند — برای آن‌ها overhead هدرِ
    # gzip می‌تواند از خودِ فایل بزرگ‌تر باشد.
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # Serve collected static files (CSS/JS/admin assets) directly —
    # much faster than routing every CSS request through Django/Gunicorn.
    location /static/ {
        alias /app/backend/staticfiles/;
    }

    # Same idea for user-uploaded media (product images, etc.)
    location /media/ {
        alias /app/backend/media/;
    }

    # Everything else (actual page requests) goes to Django via Gunicorn
    location / {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
